<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星足跡｜費用試算（正式價）</title>

<style>
:root{--pri:#2E7D6B;--bg:#F7FBF9;--muted:#566;--r:14px;--shadow:0 8px 24px #0002}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;margin:0;background:var(--bg)}
.wrap{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.seg button{padding:6px 10px;border:0;background:#fff;cursor:pointer}
.seg button.active{background:var(--pri);color:#fff}
input{padding:10px;width:100%;border-radius:10px;border:1px solid #ddd}
.opt{margin-top:8px}
.disabled{opacity:.4;pointer-events:none}
.price{font-size:22px;font-weight:bold;color:var(--pri)}
</style>
</head>

<body>
<div class="wrap">

<h2>費用試算</h2>

<div class="card" id="aqua">
<h3>水化</h3>

<div class="seg">
<button data-mode="individual" class="active">個別</button>
<button data-mode="group">團體</button>
</div>

<div class="opt">
<label><input type="checkbox" id="aquaSpecial"> 特寵（≤2kg）</label>
</div>

<div class="opt">
<label id="aquaSelfLabel" class="disabled">
<input type="checkbox" id="aquaSelf" disabled> 親送
</label>
</div>

<input id="kgA" type="number" placeholder="體重 kg">

<div class="price" id="pA">—</div>

<p style="font-size:12px;color:#666;">
＊特寵親送優惠僅限「水化個別」NT$4500，其餘為 NT$5000
</p>

</div>

</div>

<script>

const nt = n => "NT$ " + n.toLocaleString()

function sync(){
  const mode = document.querySelector("#aqua .active").dataset.mode
  const special = document.querySelector("#aquaSpecial").checked
  const self = document.querySelector("#aquaSelf")
  const label = document.querySelector("#aquaSelfLabel")

  const enable = (mode==="individual" && special)

  self.disabled = !enable
  label.classList.toggle("disabled", !enable)

  if(!enable) self.checked=false
}

function calc(){
  sync()

  const kg = parseFloat(document.querySelector("#kgA").value)
  if(!kg){document.querySelector("#pA").innerText="—";return}

  const mode = document.querySelector("#aqua .active").dataset.mode
  const special = document.querySelector("#aquaSpecial").checked
  const self = document.querySelector("#aquaSelf").checked

  // 特寵
  if(special && kg<=2){
    if(mode==="individual"){
      document.querySelector("#pA").innerText = nt(self?4500:5000)
      return
    }
    document.querySelector("#pA").innerText = nt(1500)
    return
  }

  // 一般價格
  if(mode==="individual"){
    if(kg<=10)return show(6500)
    if(kg<=20)return show(7500)
    if(kg<=30)return show(8500)
    if(kg<=40)return show(9500)
  }

  if(mode==="group"){
    if(kg<=10)return show(2000)
    if(kg<=20)return show(3000)
    if(kg<=30)return show(3500)
    if(kg<=40)return show(4000)
  }

  show(10000)

  function show(p){document.querySelector("#pA").innerText=nt(p)}
}

document.querySelectorAll("#aqua button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#aqua button").forEach(x=>x.classList.remove("active"))
    b.classList.add("active")
    calc()
  }
})

document.querySelector("#aquaSpecial").onchange=calc
document.querySelector("#aquaSelf").onchange=calc
document.querySelector("#kgA").oninput=calc

</script>

</body>
</html>
